<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IIT Hyderabad Half Marathon 2026</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#111;
overflow-x:hidden;
}

.hero{

position:relative;

height:100vh;

width:100%;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

color:white;

}

.hero video{

position:absolute;

top:50%;

left:50%;

min-width:100%;

min-height:100%;

width:auto;

height:auto;

transform:translate(-50%,-50%);

object-fit:cover;

z-index:-2;

}

.overlay{

position:absolute;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

z-index:-1;

}

.content{

max-width:900px;

padding:20px;

}

.content h2{

font-size:26px;

letter-spacing:2px;

margin-bottom:20px;

}

.content h1{

font-size:72px;

font-weight:800;

color:#F7931E;

margin-bottom:15px;

}

.year{

font-size:54px;

font-weight:bold;

margin-bottom:20px;

}

.tagline{

font-size:24px;

font-style:italic;

margin-bottom:30px;

}

.info{

font-size:22px;

margin-bottom:40px;

}

.button{

display:inline-block;

padding:18px 42px;

background:#F7931E;

color:white;

text-decoration:none;

font-weight:bold;

border-radius:50px;

transition:.3s;

}

.button:hover{

background:#ffab3d;

transform:translateY(-3px);

}

.scroll{

position:absolute;

bottom:30px;

left:50%;

transform:translateX(-50%);

font-size:28px;

animation:bounce 2s infinite;

}

@keyframes bounce{

0%,100%{

transform:translate(-50%,0);

}

50%{

transform:translate(-50%,12px);

}

}

@media(max-width:768px){

.content h1{

font-size:42px;

}

.year{

font-size:34px;

}

.tagline{

font-size:18px;

}

.info{

font-size:18px;

}

}

</style>

</head>

<body>

<section class="hero">

<video autoplay muted loop playsinline>

<source src="assets/videos/hero-video.mp4" type="video/mp4">

</video>

<div class="overlay"></div>

<div class="content">

<h2>IIT Hyderabad</h2>

<h1>HALF MARATHON</h1>

<div class="year">2026</div>

<div class="tagline">

Run Beyond Limits

</div>

<div class="info">

📅 22 November 2026 &nbsp;&nbsp; | &nbsp;&nbsp; 📍 IIT Hyderabad

</div>

<a href="#" class="button">

REGISTER NOW

</a>

</div>

<div class="scroll">

⌄

</div>

</section>

</body>

</html>
