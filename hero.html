<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IITH Half Marathon 2026 | Official Website</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

--primary:#F7931E;
--primary-hover:#FFAB3D;

--dark:#111827;

--white:#ffffff;

--glass:rgba(255,255,255,.12);

--border:rgba(255,255,255,.22);

--shadow:0 15px 40px rgba(0,0,0,.25);

--transition:.35s;

}

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:'Poppins',sans-serif;

background:#111;

overflow-x:hidden;

color:#fff;

}

.hero{

position:relative;

width:100%;

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

}

.hero video{

position:absolute;

top:50%;

left:50%;

min-width:100%;

min-height:100%;

object-fit:cover;

transform:translate(-50%,-50%) scale(1);

animation:zoomVideo 20s ease-in-out infinite alternate;

z-index:-2;

}

@keyframes zoomVideo{

from{

transform:translate(-50%,-50%) scale(1);

}

to{

transform:translate(-50%,-50%) scale(1.08);

}

}

.overlay{

position:absolute;

inset:0;

background:rgba(0,0,0,.65);

z-index:-1;

}

.content{

max-width:1200px;

padding:20px;

transform:translateY(-70px);

animation:fadeUp 1.2s ease;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(-70px);

}

}

.hero-logo{

width:180px;

margin-bottom:18px;

filter:drop-shadow(0 8px 20px rgba(0,0,0,.45));

}

.content h2{

font-family:'Montserrat',sans-serif;

font-size:42px;

font-weight:700;

letter-spacing:2px;

margin-bottom:8px;

}

.content h1{

font-family:'Montserrat',sans-serif;

font-size:100px;

font-weight:800;

color:var(--primary);

margin-bottom:8px;

line-height:1;

}

.year{

font-family:'Montserrat',sans-serif;

font-size:60px;

font-weight:700;

margin-bottom:20px;

}

.tagline{

font-size:28px;

font-style:italic;

margin-bottom:35px;

opacity:.95;

}

.hero-info{

display:flex;

justify-content:center;

gap:18px;

flex-wrap:wrap;

margin-bottom:40px;

}

.badge{

background:var(--glass);

backdrop-filter:blur(12px);

border:1px solid var(--border);

padding:14px 22px;

border-radius:40px;

font-size:17px;

}

.button{

display:inline-flex;

align-items:center;

justify-content:center;

padding:20px 58px;

background:var(--primary);

color:#fff;

font-weight:700;

text-decoration:none;

border-radius:50px;

box-shadow:0 12px 30px rgba(247,147,30,.35);

transition:var(--transition);

}

.button:hover{

background:var(--primary-hover);

transform:translateY(-3px);

box-shadow:0 18px 40px rgba(247,147,30,.55);

}

.scroll-indicator{

position:absolute;

bottom:28px;

left:50%;

transform:translateX(-50%);

width:52px;

height:52px;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

border:2px solid rgba(255,255,255,.35);

background:rgba(255,255,255,.08);

backdrop-filter:blur(8px);

color:#fff;

font-size:30px;

text-decoration:none;

animation:scrollBounce 2s infinite;

transition:var(--transition);

}

.scroll-indicator:hover{

background:rgba(255,255,255,.18);

color:var(--primary);

border-color:var(--primary);

}

@keyframes scrollBounce{

0%,20%,50%,80%,100%{

transform:translateX(-50%) translateY(0);

}

40%{

transform:translateX(-50%) translateY(10px);

}

60%{

transform:translateX(-50%) translateY(5px);

}

}

@media(max-width:768px){

.hero{

height:85vh;

}

.content{

transform:none;

padding:25px;

}

.hero-logo{

width:120px;

}

.content h2{

font-size:26px;

}

.content h1{

font-size:48px;

}

.year{

font-size:38px;

}

.tagline{

font-size:18px;

}

.hero-info{

flex-direction:column;

gap:12px;

align-items:center;

}

.badge{

font-size:15px;

padding:10px 18px;

}

.button{

padding:16px 38px;

font-size:16px;

}

}

  /* ==============================
NAVBAR
============================== */

.navbar{

position:fixed;

top:0;

left:0;

width:100%;

z-index:999;

transition:.4s;

padding:18px 0;

}

.nav-container{

width:min(1300px,92%);

margin:auto;

display:flex;

justify-content:space-between;

align-items:center;

}

.logo-area{

display:flex;

align-items:center;

gap:12px;

text-decoration:none;

color:#fff;

font-weight:600;

}

.nav-logo{

width:42px;

}

.nav-links{

display:flex;

gap:35px;

list-style:none;

}

.nav-links a{

color:#fff;

text-decoration:none;

transition:.3s;

font-weight:500;

}

.nav-links a:hover{

color:var(--primary);

}

.nav-register{

background:var(--primary);

padding:12px 22px;

border-radius:30px;

color:#fff;

text-decoration:none;

font-weight:600;

transition:.3s;

}

.nav-register:hover{

background:var(--primary-hover);

}

.menu-toggle{

display:none;

font-size:28px;

cursor:pointer;

}

/* ==============================
Responsive Navbar
============================== */

@media(max-width:900px){

.nav-links{

display:none;

}

.nav-register{

display:none;

}

.menu-toggle{

display:block;

}

.logo-area span{

font-size:16px;

}

}
  

</style>



</head>
  
<body>

<section class="hero" id="home">

<video autoplay muted loop playsinline>
    <source src="assets/videos/hero-video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- ==========================
        Navigation
=========================== -->

<nav class="navbar">

<div class="nav-container">

<a href="#home" class="logo-area">

<img src="assets/images/logo.png" class="nav-logo">

<span>IITH Half Marathon</span>

</a>

<ul class="nav-links">

<li><a href="#home">Home</a></li>

<li><a href="#countdown">Countdown</a></li>

<li><a href="#categories">Categories</a></li>

<li><a href="#gallery">Gallery</a></li>

<li><a href="#route">Route</a></li>

<li><a href="#faq">FAQ</a></li>

</ul>

<a href="https://YOUR-REGISTRATION-LINK"
class="nav-register"
target="_blank">

Register

</a>

<div class="menu-toggle">

☰

</div>

</div>

</nav>

<!-- ==========================
        Hero Content
=========================== -->

<div class="content">

<img src="assets/images/logo.png"
class="hero-logo"
alt="IIT Hyderabad">

<h2>IIT Hyderabad</h2>

<h1>HALF MARATHON</h1>

<div class="year">

2026

</div>

<div class="tagline">

Run Beyond Limits

</div>

<div class="hero-info">

<div class="badge">

📅 22 November 2026

</div>

<div class="badge">

📍 IIT Hyderabad Campus

</div>

</div>

<a href="https://YOUR-REGISTRATION-LINK"

class="button"

target="_blank">

REGISTER NOW →

</a>

</div>

<a href="#countdown"

class="scroll-indicator"

aria-label="Scroll">

⌄

</a>

</section>

<!-- ==========================
 Countdown Placeholder
=========================== -->

<section id="countdown">

<div style="height:120px;background:#fff;color:#222;display:flex;justify-content:center;align-items:center;font-size:32px;font-weight:bold;">

Countdown Coming Next →

</div>

</section>

</body>

</html>
